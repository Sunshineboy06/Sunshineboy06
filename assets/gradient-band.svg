<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="做出来，用起来，再做好">
  <defs>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#714cb6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#714cb6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4c7ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d4c7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#421d24" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#421d24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#f2f0eb"/>
  <circle cx="900" cy="120" r="300" fill="url(#g1)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="240" fill="url(#g2)">
    <animate attributeName="opacity" values="0.5;0.72;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="260" r="200" fill="url(#g3)"/>

  <text x="72" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#714cb6">METHOD</text>
  <text x="72" y="170" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="500" letter-spacing="-1.2" fill="#292827">做出来，用起来，再做好。</text>
  <text x="72" y="210" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="460" fill="#666666">最快的学习方式，是把东西真正做出来，然后每天用它。</text>

  <rect x="72" y="238" width="150" height="44" rx="8" fill="#ffffff" stroke="#292827"/>
  <text x="98" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14.5" fill="#292827">去 GitHub</text>
  <text x="184" y="266" font-family="Segoe UI, sans-serif" font-size="14.5" fill="#714cb6">↗</text>

  <rect x="248" y="238" width="170" height="44" rx="22" fill="#421d24"/>
  <text x="278" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14.5" fill="#ffffff">申请内测</text>
  <circle cx="392" cy="260" r="3.5" fill="#d4c7ff"/>
</svg>
