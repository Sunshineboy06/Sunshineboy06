    <animateTransform attributeName="transform" type="rotate" values="0 1076 179;360 1076 179" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- checklist -->
  <circle cx="680" cy="244" r="7" fill="#714cb6"/>
  <text x="678" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#ffffff">✓</text>
  <text x="696" y="248" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#292827">复盘昨日错题</text>
  <text x="1058" y="248" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#666666">已完成</text>

  <circle cx="680" cy="276" r="7" fill="#714cb6"/>
  <text x="678" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#ffffff">✓</text>
  <text x="696" y="280" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#292827">英语专项 · 20 分钟</text>
  <text x="1058" y="280" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#666666">已完成</text>

  <circle cx="680" cy="308" r="6.5" fill="none" stroke="#421d24" stroke-width="1.4">
    <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="696" y="312" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#666666">写一段今日简报</text>
  <text x="1058" y="312" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#714cb6">进行中</text>

  <!-- today brief -->
  <rect x="668" y="330" width="392" height="66" rx="10" fill="#f2f0eb"/>
  <text x="684" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#292827">今日简报</text>
  <text x="684" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" fill="#666666">计划 5 项 · 完成 3 项 · 复盘 12 分钟</text>
  <rect x="684" y="380" width="360" height="4" rx="2" fill="#e3e3e2"/>
  <rect x="684" y="380" width="216" height="4" rx="2" fill="#421d24"/>

  <!-- footer caption -->
  <text x="72" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#666666">目标 / 今日计划 / 证据记录 · 简报与周复盘 · PDF 与文献导入</text>
  <circle cx="1122" cy="491" r="5" fill="#0c4243">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
