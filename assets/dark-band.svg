<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="为什么坚持本地运行">
  <rect width="1200" height="400" fill="#0c4243"/>

  <!-- layered translucent geometry (left) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="9s" repeatCount="indefinite"/>
    <rect x="96" y="96" width="300" height="200" rx="18" fill="#d4c7ff" fill-opacity="0.16" transform="rotate(-8 246 196)"/>
    <rect x="140" y="130" width="300" height="200" rx="18" fill="#ffffff" fill-opacity="0.08" transform="rotate(5 290 230)"/>
    <rect x="112" y="210" width="220" height="120" rx="14" fill="#714cb6" fill-opacity="0.22" transform="rotate(-3 222 270)"/>
  </g>
  <text x="150" y="300" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#ffffff" opacity="0.55" transform="rotate(-6 150 300)">本地优先</text>
  <circle cx="420" cy="104" r="5" fill="#d4c7ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- right: copy -->
  <text x="640" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#d4c7ff">LOCAL FIRST</text>
  <text x="640" y="196" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="500" letter-spacing="-1.2" fill="#ffffff">为什么坚持本地运行</text>
  <text x="640" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="460" fill="#ffffff" opacity="0.82">单用户、单机、环回地址——隐私不是功能，是前提。</text>
  <text x="640" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" opacity="0.7">只监听 127.0.0.1 · 不要求登录、不收集密钥 · 敏感操作必须人工审批</text>

  <rect x="640" y="304" width="196" height="44" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
  <text x="668" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14.5" fill="#ffffff">阅读隐私设计</text>
  <text x="808" y="332" font-family="Segoe UI, sans-serif" font-size="14.5" fill="#d4c7ff">↗</text>
</svg>
